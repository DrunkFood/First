server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

spring:
  application:
    name: ele-ai-tender-file
  config:
    import: optional:file:${user.home}/.ele-ai-tender/ele-ai-tender-file-local.yml
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/ele_ai_tender?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:6}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

jwt:
  secret: ${APP_JWT_SECRET:ele-ai-tender-jwt-secret-key-must-be-at-least-256-bits}
  expiration: ${APP_JWT_EXPIRATION:7200}
  external-expiration: ${APP_JWT_EXTERNAL_EXPIRATION:604800}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jy.eleaitender.file.entity
  global-config:
    db-config:
      id-type: auto
      table-prefix: file_
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# 文件存储配置
file:
  storage:
    base-path: ${FILE_STORAGE_BASE_PATH:E:\java\filestore\ele-ai-tender\files}
    allowed-types: .doc,.docx,.pdf,.txt,.md,.jar,.war,.zip,.tar.gz
    max-size: 500

swagger:
  enabled: true

logging:
  level:
    com.jy.eleaitender: debug
