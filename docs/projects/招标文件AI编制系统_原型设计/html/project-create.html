<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招标文件生成系统 - 新建项目</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --brand-color: #336CFF;
            --auxiliary-color: #31E3FD;
            --embellishment-color: #FF8D3B;
            --bg-primary: #0F1419;
            --bg-secondary: #1A1F26;
            --bg-tertiary: #242B33;
            --bg-elevated: #2D353D;
            --text-primary: #F0F2F5;
            --text-secondary: #B9BBBE;
            --text-tertiary: #8B8E93;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-medium: rgba(255, 255, 255, 0.12);
            --hover-state: rgba(51, 108, 255, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --card-bg: rgba(26, 31, 38, 0.95);
            --input-bg: rgba(15, 20, 25, 0.6);
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
        }
        
        @media (prefers-color-scheme: light) {
            :root {
                --brand-color: #336CFF;
                --auxiliary-color: #00B8D4;
                --embellishment-color: #FF9800;
                --bg-primary: #FFFFFF;
                --bg-secondary: #F8F9FA;
                --bg-tertiary: #F1F3F4;
                --bg-elevated: #FFFFFF;
                --text-primary: #1F2937;
                --text-secondary: #4B5563;
                --text-tertiary: #6B7280;
                --border-light: rgba(0, 0, 0, 0.08);
                --border-medium: rgba(0, 0, 0, 0.12);
                --hover-state: rgba(51, 108, 255, 0.06);
                --shadow-color: rgba(0, 0, 0, 0.08);
                --card-bg: rgba(255, 255, 255, 0.98);
                --input-bg: rgba(243, 244, 246, 0.8);
            }
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .layout {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 220px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            padding: 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--brand-color);
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
        }
        
        .nav-item {
            padding: 14px 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
        }
        
        .nav-item:hover, .nav-item.active {
            background: var(--hover-state);
            color: var(--brand-color);
            border-left-color: var(--brand-color);
        }
        
        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 0;
        }
        
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .breadcrumb {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .breadcrumb a:hover {
            color: var(--brand-color);
        }
        
        .breadcrumb span {
            margin: 0 8px;
            color: var(--text-tertiary);
        }
        
        .breadcrumb .current {
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        
        .message-icon {
            position: relative;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }
        
        .message-icon:hover {
            background: var(--hover-state);
            color: var(--brand-color);
        }
        
        .message-badge {
            background: var(--danger-color);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
            line-height: 1;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }
        
        .user-info:hover {
            background: var(--hover-state);
            color: var(--brand-color);
        }
        
        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-color), var(--auxiliary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }
        
        .content-area {
            padding: 24px 40px;
            max-width: 1600px;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        
        .btn-primary {
            background: var(--brand-color);
            color: white;
        }
        
        .btn-primary:hover {
            background: #2855d9;
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        
        .btn-secondary:hover {
            background: var(--bg-elevated);
            border-color: var(--border-medium);
        }
        
        .btn-success {
            background: var(--success-color);
            color: white;
        }
        
        .btn-success:hover {
            background: #0ea572;
        }
        
        .btn-danger {
            background: var(--danger-color);
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc3939;
        }
        
        .form-container {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-light);
            overflow: hidden;
        }
        
        .form-section {
            padding: 24px;
            border-bottom: 1px solid var(--border-light);
        }
        
        .form-section:last-child {
            border-bottom: none;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--brand-color);
        }
        
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-row:last-child {
            margin-bottom: 0;
        }
        
        .form-group {
            flex: 1;
        }
        
        .form-group.half {
            flex: 0 0 calc(50% - 10px);
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        
        .form-label .required {
            color: var(--danger-color);
            margin-left: 2px;
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--brand-color);
            box-shadow: 0 0 0 2px rgba(51, 108, 255, 0.1);
        }
        
        .form-select {
            cursor: pointer;
        }
        
        .form-textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            padding: 8px 0;
        }
        
        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .radio-item input[type="radio"] {
            cursor: pointer;
        }
        
        .radio-item label {
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .dynamic-list {
            border: 1px solid var(--border-light);
            border-radius: 6px;
            overflow: hidden;
        }
        
        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-bottom: 1px solid var(--border-light);
            background: var(--input-bg);
        }
        
        .list-item:last-child {
            border-bottom: none;
        }
        
        .list-item .item-number {
            width: 24px;
            height: 24px;
            background: var(--brand-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .list-item .item-input {
            flex: 1;
        }
        
        .list-item .item-input input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 13px;
        }
        
        .list-item .item-input input:focus {
            outline: none;
            border-color: var(--brand-color);
        }
        
        .list-item .item-actions {
            display: flex;
            gap: 8px;
        }
        
        .icon-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        
        .icon-btn:hover {
            background: var(--hover-state);
            color: var(--brand-color);
        }
        
        .icon-btn svg {
            width: 16px;
            height: 16px;
        }
        
        .icon-btn.danger:hover {
            color: var(--danger-color);
        }
        
        .icon-btn.success:hover {
            color: var(--success-color);
        }
        
        .add-item-btn {
            width: 100%;
            padding: 12px;
            border: 1px dashed var(--border-medium);
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        
        .add-item-btn:hover {
            border-color: var(--brand-color);
            color: var(--brand-color);
            background: var(--hover-state);
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 24px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-light);
        }
        
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            background: var(--brand-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(51, 108, 255, 0.3);
            z-index: 1000;
            transition: all 0.2s;
        }
        
        .theme-toggle:hover {
            background: #2855d9;
        }
        
        .hint-text {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }
        
        .auto-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(51, 108, 255, 0.15);
            color: var(--brand-color);
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-title">招标文件生成系统</div>
            <div class="nav-item" onclick="window.location.href='business-requirement-list.html'">编制业务需求</div>
            <div class="nav-item active" onclick="window.location.href='project-list.html'">项目管理</div>
            <div class="nav-item" onclick="window.location.href='template-list.html'">模板管理</div>
            <div class="nav-item" onclick="window.location.href='statistics.html'">统计分析</div>
            <div class="nav-item" onclick="window.location.href='message-center.html'">消息中心</div>
            <div class="nav-item" onclick="window.location.href='system-settings.html'">系统设置</div>
        </div>
        
        <div class="main-content">
            <div class="top-bar">
                <div class="breadcrumb">
                    <a href="project-list.html">首页</a>
                    <span>/</span>
                    <a href="project-list.html">项目管理</a>
                    <span>/</span>
                    <span class="current">新建项目</span>
                </div>
                <div class="header-actions">
                    <div class="message-icon" onclick="window.location.href='message-center.html'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="message-badge">3</span>
                    </div>
                    <div class="user-info" onclick="openUserSettings()">
                        <div class="user-avatar">1</div>
                        <span>135****2345</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 9h6v6H6zm6-6h6v6h-6z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="content-area">
                <div class="page-header">
                    <h1 class="page-title">新建项目</h1>
                    <button class="btn btn-secondary" onclick="window.location.href='project-list.html'">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        返回列表
                    </button>
                </div>
                
                <div class="form-container">
                    <form id="projectForm">
                        <div class="form-section">
                            <h3 class="section-title">项目基本信息</h3>
                            
                            <div class="form-row">
                                <div class="form-group half">
                                    <label class="form-label">
                                        项目编号<span class="required">*</span>
                                    </label>
                                    <input type="text" class="form-input" id="projectCode" placeholder="请输入项目编号" required>
                                    <div class="hint-text">长度1-50字符，不可重复</div>
                                </div>
                                <div class="form-group half">
                                    <label class="form-label">
                                        项目名称<span class="required">*</span>
                                    </label>
                                    <input type="text" class="form-input" id="projectName" placeholder="请输入项目名称" required>
                                    <div class="hint-text">长度1-100字符，不可重复</div>
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group half">
                                    <label class="form-label">
                                        项目类别<span class="required">*</span>
                                    </label>
                                    <select class="form-select" id="projectCategory" required>
                                        <option value="">请选择项目类别</option>
                                        <option value="below-limit">限额以下</option>
                                        <option value="property-transaction">产权交易</option>
                                        <option value="government-procurement">政府采购</option>
                                    </select>
                                </div>
                                <div class="form-group half">
                                    <label class="form-label">
                                        项目类型<span class="required">*</span>
                                    </label>
                                    <select class="form-select" id="projectType" required>
                                        <option value="">请选择项目类型</option>
                                        <option value="engineering">工程类</option>
                                        <option value="goods">货物类</option>
                                        <optgroup label="服务类">
                                            <option value="service">服务类</option>
                                            <option value="property">物业</option>
                                            <option value="it-service">IT服务</option>
                                            <option value="consulting">咨询服务</option>
                                            <option value="maintenance">维保服务</option>
                                        </optgroup>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group half">
                                    <label class="form-label">
                                        项目预算(万元)<span class="required">*</span>
                                    </label>
                                    <input type="number" class="form-input" id="projectBudget" placeholder="请输入项目预算" step="0.01" min="0" required>
                                    <div class="hint-text">正数，保留2位小数</div>
                                </div>
                                <div class="form-group half">
                                    <label class="form-label">
                                        评审类型<span class="required">*</span>
                                        <span class="auto-badge">自动推荐</span>
                                    </label>
                                    <div class="radio-group">
                                        <div class="radio-item">
                                            <input type="radio" id="reviewManual" name="reviewType" value="manual">
                                            <label for="reviewManual">人工评审</label>
                                        </div>
                                        <div class="radio-item">
                                            <input type="radio" id="reviewSmart" name="reviewType" value="smart">
                                            <label for="reviewSmart">智能评审</label>
                                        </div>
                                    </div>
                                    <div class="hint-text">根据预算和类型自动推荐</div>
                                </div>
                            </div>
                            

                            

                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">
                                        招标需求<span class="required">*</span>
                                    </label>
                                    <div class="tender-demand-mode">
                                        <div class="radio-group">
                                            <div class="radio-item">
                                                <input type="radio" id="tenderMode1" name="tenderMode" value="reference" checked onchange="handleTenderModeChange()">
                                                <label for="tenderMode1">模式1：引用</label>
                                            </div>
                                            <div class="radio-item">
                                                <input type="radio" id="tenderMode2" name="tenderMode" value="generate" onchange="handleTenderModeChange()">
                                                <label for="tenderMode2">模式2：系统生成</label>
                                            </div>
                                        </div>
                                        
                                        <!-- 模式1：引用 -->
                                        <div id="tenderMode1Content" class="tender-mode-content" style="margin-top: 16px;">
                                            <div class="form-group">
                                                <label class="form-label">来源</label>
                                                <select class="form-select" id="tenderSource" onchange="handleTenderSourceChange()">
                                                    <option value="">请选择来源</option>
                                                    <option value="business-requirement">选择编制业务需求模块的项目</option>
                                                    <option value="direct">直接录入</option>
                                                </select>
                                            </div>
                                            
                                            <!-- 来源1：选择编制业务需求模块的项目 -->
                                            <div id="tenderSource1Content" class="tender-source-content" style="display: none; margin-top: 16px;">
                                                <select class="form-select" id="businessRequirementProject" onchange="showBusinessRequirement()">
                                                    <option value="">请选择业务需求项目</option>
                                                    <option value="project1">XX市政道路改造工程（已定稿）</option>
                                                    <option value="project2">办公设备采购业务需求（已定稿）</option>
                                                    <option value="project3">城市道路维修工程（已定稿）</option>
                                                </select>
                                                <div class="hint-text">展示其定稿的业务需求</div>
                                                
                                                <!-- 业务需求展示区域 -->
                                                <div id="businessRequirementPreview" class="business-requirement-preview" style="display: none; margin-top: 16px; padding: 16px; background: var(--bg-tertiary); border-radius: 6px;">
                                                    <h4 style="font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px;">业务需求内容</h4>
                                                    <div id="businessRequirementContent" style="font-size: 13px; color: var(--text-secondary); line-height: 1.6;"></div>
                                                </div>
                                            </div>
                                            
                                            <!-- 来源2：直接录入 -->
                                            <div id="tenderSource2Content" class="tender-source-content" style="display: none; margin-top: 16px;">
                                                <textarea class="form-textarea" id="tenderContent" placeholder="请输入招标需求内容"></textarea>
                                            </div>
                                        </div>
                                        
                                        <!-- 模式2：系统生成 -->
                                        <div id="tenderMode2Content" class="tender-mode-content" style="display: none; margin-top: 16px;">
                                            <label class="form-label">项目描述</label>
                                            <textarea class="form-textarea" id="generateProjectDescription" placeholder="请输入项目描述"></textarea>
                                            <div class="hint-text">系统将根据项目描述生成招标需求</div>

                                            
                                            <!-- 生成结果展示 -->
                                            <div id="generateResult" class="generate-result" style="display: none; margin-top: 16px; padding: 16px; background: var(--bg-tertiary); border-radius: 6px;">
                                                <h4 style="font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px;">生成的招标需求</h4>
                                                <div id="generatedTenderContent" style="font-size: 13px; color: var(--text-secondary); line-height: 1.6;"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="window.location.href='project-list.html'">取消</button>
                            <button type="button" class="btn btn-primary" onclick="saveProject()">保存并继续</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function saveProject() {
            const projectName = document.getElementById('projectName').value;
            const projectCategory = document.getElementById('projectCategory').value;
            const projectType = document.getElementById('projectType').value;
            const projectBudget = document.getElementById('projectBudget').value;
            const reviewType = document.querySelector('input[name="reviewType"]:checked');
            
            if (!projectName) {
                alert('请输入项目名称');
                return;
            }
            
            if (!projectCategory) {
                alert('请选择项目类别');
                return;
            }
            
            if (!projectType) {
                alert('请选择项目类型');
                return;
            }
            
            if (!projectBudget) {
                alert('请输入项目预算');
                return;
            }
            
            if (!reviewType) {
                alert('请选择评审类型');
                return;
            }
            
            alert('项目创建成功！即将跳转到基础信息输入页');
            window.location.href = 'project-init.html';
        }
        
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.style.getPropertyValue('--bg-primary');
            
            if (currentTheme === '#FFFFFF') {
                body.style.setProperty('--bg-primary', '#0F1419');
                body.style.setProperty('--bg-secondary', '#1A1F26');
                body.style.setProperty('--bg-tertiary', '#242B33');
                body.style.setProperty('--text-primary', '#F0F2F5');
                body.style.setProperty('--text-secondary', '#B9BBBE');
            } else {
                body.style.setProperty('--bg-primary', '#FFFFFF');
                body.style.setProperty('--bg-secondary', '#F8F9FA');
                body.style.setProperty('--bg-tertiary', '#F1F3F4');
                body.style.setProperty('--text-primary', '#1F2937');
                body.style.setProperty('--text-secondary', '#4B5563');
            }
        }
        
        document.getElementById('projectBudget').addEventListener('input', function(e) {
            const budget = parseFloat(e.target.value);
            const projectType = document.getElementById('projectType').value;
            
            if (budget && projectType) {
                if (budget >= 500 || projectType === 'engineering' || projectType === 'goods') {
                    document.getElementById('reviewManual').checked = true;
                } else {
                    document.getElementById('reviewSmart').checked = true;
                }
            }
        });
        
        document.getElementById('projectType').addEventListener('change', function(e) {
            const budget = parseFloat(document.getElementById('projectBudget').value);
            const projectType = e.target.value;
            
            if (budget && projectType) {
                if (budget >= 500 || projectType === 'engineering' || projectType === 'goods') {
                    document.getElementById('reviewManual').checked = true;
                } else {
                    document.getElementById('reviewSmart').checked = true;
                }
            }
        });
        
        // 招标需求模式切换处理
        function handleTenderModeChange() {
            const tenderMode = document.querySelector('input[name="tenderMode"]:checked').value;
            const tenderMode1Content = document.getElementById('tenderMode1Content');
            const tenderMode2Content = document.getElementById('tenderMode2Content');
            
            if (tenderMode === 'reference') {
                tenderMode1Content.style.display = 'block';
                tenderMode2Content.style.display = 'none';
            } else {
                tenderMode1Content.style.display = 'none';
                tenderMode2Content.style.display = 'block';
            }
        }
        
        // 招标需求来源切换处理
        function handleTenderSourceChange() {
            const tenderSource = document.getElementById('tenderSource').value;
            const tenderSource1Content = document.getElementById('tenderSource1Content');
            const tenderSource2Content = document.getElementById('tenderSource2Content');
            
            if (tenderSource === 'business-requirement') {
                tenderSource1Content.style.display = 'block';
                tenderSource2Content.style.display = 'none';
            } else if (tenderSource === 'direct') {
                tenderSource1Content.style.display = 'none';
                tenderSource2Content.style.display = 'block';
            } else {
                tenderSource1Content.style.display = 'none';
                tenderSource2Content.style.display = 'none';
            }
        }
        
        // 展示业务需求
        function showBusinessRequirement() {
            const projectId = document.getElementById('businessRequirementProject').value;
            const previewDiv = document.getElementById('businessRequirementPreview');
            const contentDiv = document.getElementById('businessRequirementContent');
            
            if (projectId) {
                // 模拟业务需求内容
                let content = '';
                if (projectId === 'project1') {
                    content = `# XX市政道路改造工程业务需求\n\n## 1. 项目概况\n本项目为XX市市政道路改造工程，位于XX市XX区，主要涉及XX路、XX路等多条城市主干道的改造升级。项目总预算为500万元，计划工期为180天。\n\n## 2. 项目目标\n2.1 提升道路通行能力，缓解交通拥堵\n2.2 改善道路基础设施，提高道路安全性\n2.3 优化交通组织，提升市民出行体验\n2.4 美化道路环境，提升城市形象\n\n## 3. 技术要求\n3.1 道路工程\n- 道路拓宽：将现有双向4车道拓宽为双向6车道\n- 路面修复：对现有破损路面进行修复，采用沥青混凝土路面\n- 排水系统：完善道路排水系统，确保雨天排水顺畅\n\n3.2 交通设施\n- 交通信号灯：更新现有交通信号灯，实现智能控制\n- 交通标志：增设和更新交通标志，确保标识清晰\n- 监控系统：安装道路监控系统，提高道路安全性\n\n3.3 绿化工程\n- 道路两侧增设绿化带，种植适宜本地生长的植物\n- 对现有绿化进行升级改造，提升绿化效果`;
                } else if (projectId === 'project2') {
                    content = `# 办公设备采购业务需求\n\n## 1. 项目概况\n本项目为XX单位办公设备采购，主要包括电脑、打印机、复印机等办公设备。项目总预算为120万元，计划采购周期为30天。\n\n## 2. 采购内容\n2.1 台式电脑：50台\n2.2 笔记本电脑：30台\n2.3 激光打印机：10台\n2.4 彩色复印机：5台\n\n## 3. 技术要求\n3.1 台式电脑：i5处理器，8GB内存，256GB固态硬盘\n3.2 笔记本电脑：i7处理器，16GB内存，512GB固态硬盘\n3.3 激光打印机：黑白激光，每分钟30页打印速度\n3.4 彩色复印机：彩色激光，每分钟25页打印速度`;
                } else if (projectId === 'project3') {
                    content = `# 城市道路维修工程业务需求\n\n## 1. 项目概况\n本项目为XX市城市道路维修工程，主要涉及XX区多条道路的破损修复。项目总预算为450万元，计划工期为120天。\n\n## 2. 维修内容\n2.1 路面坑洞修复\n2.2 人行道铺装\n2.3 路缘石更换\n2.4 排水设施维修\n\n## 3. 技术要求\n3.1 路面材料：采用高强度沥青混凝土\n3.2 施工工艺：符合国家相关标准\n3.3 质量保证：提供2年质量保修期`;
                }
                
                contentDiv.innerHTML = content.replace(/\n/g, '<br>');
                previewDiv.style.display = 'block';
            } else {
                previewDiv.style.display = 'none';
            }
        }
    </script>
</body>
</html>
