<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招标文件生成系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --brand-color: #336CFF;
            --auxiliary-color: #31E3FD;
            --embellishment-color: #FF8D3B;
            --bg-primary: #0F1419;
            --bg-secondary: #1A1F26;
            --bg-tertiary: #242B33;
            --bg-elevated: #2D353D;
            --text-primary: #F0F2F5;
            --text-secondary: #B9BBBE;
            --text-tertiary: #8B8E93;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-medium: rgba(255, 255, 255, 0.12);
            --hover-state: rgba(51, 108, 255, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --card-bg: rgba(26, 31, 38, 0.95);
            --input-bg: rgba(15, 20, 25, 0.6);
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
        }
        
        @media (prefers-color-scheme: light) {
            :root {
                --brand-color: #336CFF;
                --auxiliary-color: #00B8D4;
                --embellishment-color: #FF9800;
                --bg-primary: #FFFFFF;
                --bg-secondary: #F8F9FA;
                --bg-tertiary: #F1F3F4;
                --bg-elevated: #FFFFFF;
                --text-primary: #1F2937;
                --text-secondary: #4B5563;
                --text-tertiary: #6B7280;
                --border-light: rgba(0, 0, 0, 0.08);
                --border-medium: rgba(0, 0, 0, 0.12);
                --hover-state: rgba(51, 108, 255, 0.06);
                --shadow-color: rgba(0, 0, 0, 0.08);
                --card-bg: rgba(255, 255, 255, 0.98);
                --input-bg: rgba(243, 244, 246, 0.8);
            }
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        
        .login-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            z-index: 1;
        }
        
        /* 科技感纵深背景 */
        .tech-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .tech-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(51, 108, 255, 0.05) 25%, transparent 25%),
                        linear-gradient(-45deg, rgba(51, 108, 255, 0.05) 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, rgba(51, 108, 255, 0.05) 75%),
                        linear-gradient(-45deg, transparent 75%, rgba(51, 108, 255, 0.05) 75%);
            background-size: 100px 100px;
            background-position: 0 0, 0 50px, 50px -50px, -50px 0px;
            animation: gridMove 20s linear infinite;
        }
        
        .tech-orbs {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            animation: float 8s ease-in-out infinite;
        }
        
        .orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: rgba(51, 108, 255, 0.1);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .orb:nth-child(2) {
            width: 200px;
            height: 200px;
            background: rgba(49, 227, 253, 0.1);
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }
        
        .orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: rgba(255, 141, 59, 0.1);
            bottom: 10%;
            left: 30%;
            animation-delay: 4s;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 100px); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        
        .login-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-medium);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--brand-color);
            box-shadow: 0 0 0 2px rgba(51, 108, 255, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--text-tertiary);
        }
        
        .phone-input-container {
            display: flex;
            gap: 12px;
        }
        
        .phone-input {
            flex: 1;
        }
        
        .verification-code-input {
            flex: 1;
        }
        
        .send-code-btn {
            padding: 0 16px;
            background: var(--brand-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .send-code-btn:hover {
            background: #2855d9;
        }
        
        .send-code-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-tertiary);
            cursor: not-allowed;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--brand-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        
        .login-btn:hover {
            background: #2855d9;
        }
        
        .login-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-tertiary);
            cursor: not-allowed;
        }
        
        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .login-footer a {
            color: var(--brand-color);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .login-footer a:hover {
            color: var(--auxiliary-color);
        }
        
        .error-message {
            color: var(--danger-color);
            font-size: 12px;
            margin-top: 4px;
        }
        
        .success-message {
            color: var(--success-color);
            font-size: 12px;
            margin-top: 4px;
        }
        
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            background: var(--brand-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(51, 108, 255, 0.3);
            z-index: 1000;
            transition: all 0.2s;
        }
        
        .theme-toggle:hover {
            background: #2855d9;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 科技感纵深背景 -->
        <div class="tech-background">
            <div class="tech-grid"></div>
            <div class="tech-orbs">
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
            </div>
        </div>
        
        <!-- 登录卡片 -->
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">招标文件生成系统</h1>
                <p class="login-subtitle">手机号验证码登录</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">手机号码</label>
                    <input type="tel" class="form-input phone-input" id="phone" placeholder="请输入手机号码" required>
                    <div id="phoneError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="phone-input-container">
                        <input type="text" class="form-input verification-code-input" id="verificationCode" placeholder="请输入验证码" required>
                        <button type="button" class="send-code-btn" id="sendCodeBtn" onclick="sendVerificationCode()">发送验证码</button>
                    </div>
                    <div id="codeError" class="error-message"></div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">登录</button>
                
                <div class="login-footer">
                    <p>登录即表示同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a></p>
                </div>
            </form>
        </div>
    </div>
    
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    
    <script>
        let countdown = 60;
        let timer = null;
        
        // 发送验证码
        function sendVerificationCode() {
            const phone = document.getElementById('phone').value;
            const phoneError = document.getElementById('phoneError');
            
            // 验证手机号
            if (!validatePhone(phone)) {
                phoneError.textContent = '请输入有效的手机号码';
                return;
            }
            
            phoneError.textContent = '';
            
            // 模拟发送验证码
            const sendCodeBtn = document.getElementById('sendCodeBtn');
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = `${countdown}秒后重发`;
            
            timer = setInterval(() => {
                countdown--;
                sendCodeBtn.textContent = `${countdown}秒后重发`;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = '发送验证码';
                    countdown = 60;
                }
            }, 1000);
            
            // 模拟发送成功
            console.log(`向 ${phone} 发送验证码`);
            alert('验证码已发送，测试环境请输入：123456');
        }
        
        // 验证手机号
        function validatePhone(phone) {
            const phoneRegex = /^1[3-9]\d{9}$/;
            return phoneRegex.test(phone);
        }
        
        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const verificationCode = document.getElementById('verificationCode').value;
            const phoneError = document.getElementById('phoneError');
            const codeError = document.getElementById('codeError');
            const loginBtn = document.getElementById('loginBtn');
            
            // 验证表单
            let isValid = true;
            
            if (!validatePhone(phone)) {
                phoneError.textContent = '请输入有效的手机号码';
                isValid = false;
            } else {
                phoneError.textContent = '';
            }
            
            if (!verificationCode || verificationCode.length !== 6) {
                codeError.textContent = '请输入6位验证码';
                isValid = false;
            } else {
                codeError.textContent = '';
            }
            
            if (!isValid) {
                return;
            }
            
            // 模拟登录过程
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            
            setTimeout(() => {
                // 模拟登录成功
                console.log(`登录成功：${phone}`);
                
                // 模拟自动注册逻辑
                const isNewUser = Math.random() > 0.5; // 模拟50%概率为新用户
                
                if (isNewUser) {
                    alert('您是新用户，已自动为您注册账号');
                }
                
                // 跳转到政策文件管理页
                window.location.href = 'policy-file-list.html';
            }, 1500);
        });
        
        // 主题切换
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.style.getPropertyValue('--bg-primary');
            
            if (currentTheme === '#FFFFFF') {
                body.style.setProperty('--bg-primary', '#0F1419');
                body.style.setProperty('--bg-secondary', '#1A1F26');
                body.style.setProperty('--bg-tertiary', '#242B33');
                body.style.setProperty('--text-primary', '#F0F2F5');
                body.style.setProperty('--text-secondary', '#B9BBBE');
            } else {
                body.style.setProperty('--bg-primary', '#FFFFFF');
                body.style.setProperty('--bg-secondary', '#F8F9FA');
                body.style.setProperty('--bg-tertiary', '#F1F3F4');
                body.style.setProperty('--text-primary', '#1F2937');
                body.style.setProperty('--text-secondary', '#4B5563');
            }
        }
    </script>
</body>
</html>
