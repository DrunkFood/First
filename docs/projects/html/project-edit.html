<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招标文件生成系统 - 编辑项目</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --brand-color: #336CFF;
            --auxiliary-color: #31E3FD;
            --embellishment-color: #FF8D3B;
            --bg-primary: #0F1419;
            --bg-secondary: #1A1F26;
            --bg-tertiary: #242B33;
            --bg-elevated: #2D353D;
            --text-primary: #F0F2F5;
            --text-secondary: #B9BBBE;
            --text-tertiary: #8B8E93;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-medium: rgba(255, 255, 255, 0.12);
            --hover-state: rgba(51, 108, 255, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --card-bg: rgba(26, 31, 38, 0.95);
            --input-bg: rgba(15, 20, 25, 0.6);
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
        }
        
        @media (prefers-color-scheme: light) {
            :root {
                --brand-color: #336CFF;
                --auxiliary-color: #00B8D4;
                --embellishment-color: #FF9800;
                --bg-primary: #FFFFFF;
                --bg-secondary: #F8F9FA;
                --bg-tertiary: #F1F3F4;
                --bg-elevated: #FFFFFF;
                --text-primary: #1F2937;
                --text-secondary: #4B5563;
                --text-tertiary: #6B7280;
                --border-light: rgba(0, 0, 0, 0.08);
                --border-medium: rgba(0, 0, 0, 0.12);
                --hover-state: rgba(51, 108, 255, 0.06);
                --shadow-color: rgba(0, 0, 0, 0.08);
                --card-bg: rgba(255, 255, 255, 0.98);
                --input-bg: rgba(243, 244, 246, 0.8);
            }
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .layout {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 220px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            padding: 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--brand-color);
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
        }
        
        .nav-item {
            padding: 14px 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
        }
        
        .nav-item:hover, .nav-item.active {
            background: var(--hover-state);
            color: var(--brand-color);
            border-left-color: var(--brand-color);
        }
        
        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 0;
        }
        
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .breadcrumb {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .breadcrumb a:hover {
            color: var(--brand-color);
        }
        
        .breadcrumb span {
            margin: 0 8px;
            color: var(--text-tertiary);
        }
        
        .breadcrumb .current {
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        
        .message-icon {
            position: relative;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }
        
        .message-icon:hover {
            background: var(--hover-state);
            color: var(--brand-color);
        }
        
        .message-badge {
            background: var(--danger-color);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
            line-height: 1;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }
        
        .user-info:hover {
            background: var(--hover-state);
            color: var(--brand-color);
        }
        
        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-color), var(--auxiliary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }
        
        .content-area {
            padding: 24px 40px;
            max-width: 1400px;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .form-card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-light);
            padding: 32px;
        }
        
        .form-section {
            margin-bottom: 32px;
        }
        
        .form-section:last-child {
            margin-bottom: 0;
        }
        
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--brand-color);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 20px;
        }
        
        .form-row.single {
            grid-template-columns: 1fr;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .form-label .required {
            color: var(--danger-color);
            margin-left: 4px;
        }
        
        .form-input {
            padding: 10px 14px;
            border: 1px solid var(--border-medium);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--brand-color);
            background: var(--bg-elevated);
        }
        
        .form-input::placeholder {
            color: var(--text-tertiary);
        }
        
        .form-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .form-select {
            padding: 10px 14px;
            border: 1px solid var(--border-medium);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .form-select:focus {
            outline: none;
            border-color: var(--brand-color);
            background: var(--bg-elevated);
        }
        
        .form-textarea {
            padding: 10px 14px;
            border: 1px solid var(--border-medium);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 14px;
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .form-textarea:focus {
            outline: none;
            border-color: var(--brand-color);
            background: var(--bg-elevated);
        }
        
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 24px;
            border-top: 1px solid var(--border-light);
            margin-top: 24px;
        }
        
        .form-actions-left {
            display: flex;
            gap: 12px;
        }
        
        .form-actions-right {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .btn-primary {
            background: var(--brand-color);
            color: white;
        }
        
        .btn-primary:hover {
            background: #2855d9;
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-medium);
        }
        
        .btn-secondary:hover {
            background: var(--bg-elevated);
            border-color: var(--brand-color);
        }
        
        .btn-success {
            background: var(--success-color);
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .btn-danger {
            background: transparent;
            color: var(--danger-color);
            border-color: var(--danger-color);
        }
        
        .btn-danger:hover {
            background: var(--danger-color);
            color: white;
        }
        
        .info-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(51, 108, 255, 0.15);
            color: var(--brand-color);
        }
        
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            background: var(--brand-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(51, 108, 255, 0.3);
            z-index: 1000;
            transition: all 0.2s;
        }
        
        .theme-toggle:hover {
            background: #2855d9;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
    
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-title">招标文件生成系统</div>
            <div class="nav-item" onclick="window.location.href='business-requirement-list.html'">编制业务需求</div>
            <div class="nav-item active" onclick="window.location.href='project-list.html'">项目管理</div>
            <div class="nav-item" onclick="window.location.href='template-list.html'">模板管理</div>
            <div class="nav-item" onclick="window.location.href='statistics.html'">统计分析</div>
            <div class="nav-item" onclick="window.location.href='message-center.html'">消息中心</div>
            <div class="nav-item" onclick="window.location.href='system-settings.html'">系统设置</div>
        </div>
        
        <div class="main-content">
            <div class="top-bar">
                <div class="breadcrumb">
                    <a href="project-list.html">首页</a>
                    <span>/</span>
                    <a href="project-list.html">项目管理</a>
                    <span>/</span>
                    <span class="current">编辑项目</span>
                </div>
                <div class="header-actions">
                    <div class="message-icon" onclick="window.location.href='message-center.html'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="message-badge">3</span>
                    </div>
                    <div class="user-info">
                        <div class="user-avatar">张</div>
                        <span>张专员</span>
                    </div>
                </div>
            </div>
            
            <div class="content-area">
                <div class="page-header">
                    <h1 class="page-title">编辑项目 <span class="info-badge">ZB-2024-001</span></h1>
                </div>
                
                <div class="form-card">
                    <form id="editForm">
                        <div class="form-section">
                            <div class="section-title">项目基本信息</div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">项目编号</label>
                                    <input type="text" class="form-input" value="ZB-2024-001" disabled>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">项目名称<span class="required">*</span></label>
                                    <input type="text" class="form-input" value="某市政道路改造工程招标项目" id="projectName" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">项目类型<span class="required">*</span></label>
                                    <select class="form-select" id="projectType" required>
                                        <option value="property">物业</option>
                                    </select>
                                </div>

                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">评审类型<span class="required">*</span></label>
                                    <select class="form-select" id="reviewType" required>
                                        <option value="manual" selected>人工评审</option>
                                        <option value="intelligent">智能评标</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">项目状态</label>
                                    <input type="text" class="form-input" value="审查通过" disabled>
                                </div>
                            </div>
                            <div class="form-row single">
                                <div class="form-group">
                                    <label class="form-label">项目描述</label>
                                    <textarea class="form-textarea" id="projectDesc">本项目为某市政道路改造工程，主要包括道路拓宽、排水系统改造、绿化带建设等内容。项目总投资约500万元，计划工期6个月。</textarea>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <div class="section-title">资格要求</div>
                            <div class="form-row single">
                                <div class="form-group">
                                    <label class="form-label">资格要求说明</label>
                                    <textarea class="form-textarea" id="qualificationReq" style="min-height: 150px;">1. 具备市政公用工程施工总承包三级及以上资质
2. 具有有效的安全生产许可证
3. 近三年有类似项目业绩
4. 项目经理具有二级建造师及以上资格
5. 财务状况良好，无不良记录</textarea>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <div class="section-title">其他信息</div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">创建时间</label>
                                    <input type="text" class="form-input" value="2024-01-10 09:30" disabled>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">创建人</label>
                                    <input type="text" class="form-input" value="张专员" disabled>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">当前版本</label>
                                    <input type="text" class="form-input" value="v1.0_final" disabled>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">使用模板</label>
                                    <input type="text" class="form-input" value="市政工程招标文件模板 v2.0" disabled>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <div class="form-actions-left">
                                <button type="button" class="btn btn-secondary" onclick="window.location.href='project-list.html'">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="19" y1="12" x2="5" y2="12"></line>
                                        <polyline points="12 19 5 12 12 5"></polyline>
                                    </svg>
                                    返回列表
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="window.location.href='project-detail.html'">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    查看详情
                                </button>
                            </div>
                            <div class="form-actions-right">
                                <button type="button" class="btn btn-danger" onclick="cancelProject()">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="15" y1="9" x2="9" y2="15"></line>
                                        <line x1="9" y1="9" x2="15" y2="15"></line>
                                    </svg>
                                    取消项目
                                </button>
                                <button type="submit" class="btn btn-success">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                    保存修改
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const projectName = document.getElementById('projectName').value;
            const projectType = document.getElementById('projectType').value;
            
            if (!projectName || !projectType) {
                alert('请填写必填项');
                return;
            }
            
            if (confirm('确定保存修改吗？')) {
                alert('项目信息已更新！');
                window.location.href = 'project-detail.html';
            }
        });
        
        function cancelProject() {
            if (confirm('确定要取消此项目吗？\n取消后项目将进入搁置库。')) {
                alert('项目已取消');
                window.location.href = 'project-list.html';
            }
        }
        
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.style.getPropertyValue('--bg-primary');
            
            if (currentTheme === '#FFFFFF') {
                body.style.setProperty('--bg-primary', '#0F1419');
                body.style.setProperty('--bg-secondary', '#1A1F26');
                body.style.setProperty('--bg-tertiary', '#242B33');
                body.style.setProperty('--text-primary', '#F0F2F5');
                body.style.setProperty('--text-secondary', '#B9BBBE');
            } else {
                body.style.setProperty('--bg-primary', '#FFFFFF');
                body.style.setProperty('--bg-secondary', '#F8F9FA');
                body.style.setProperty('--bg-tertiary', '#F1F3F4');
                body.style.setProperty('--text-primary', '#1F2937');
                body.style.setProperty('--text-secondary', '#4B5563');
            }
        }
    </script>
</body>
</html>
