server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

spring:
  application:
    name: ele-tender-file
  config:
    import: optional:file:${user.home}/.ele-tender/ele-tender-file-local.yml
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/ele_tender?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:127.0.0.1}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
      database: ${SPRING_DATA_REDIS_DATABASE:${SPRING_REDIS_DATABASE:5}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}

jwt:
  secret: ${APP_JWT_SECRET:}
  expiration: ${APP_JWT_EXPIRATION:7200}
  external-expiration: ${APP_JWT_EXTERNAL_EXPIRATION:604800}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jy.eletender.file.entity
  global-config:
    db-config:
      id-type: auto
      table-prefix: file_
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 文件存储配置
file:
  storage:
    # 存储根路径
    base-path: ${FILE_STORAGE_BASE_PATH:/data/ele-tender/files}
    # 允许的文件类型
    allowed-types: .jar,.war,.zip,.tar.gz,.pdf,.HzctZbs,.HzctTbs
    # 最大文件大小(MB)
    max-size: 500

# Swagger配置
swagger:
  enabled: true

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    com.jy.eletender: debug
