server:
  port: ${SERVER_PORT:8082}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

spring:
  application:
    name: ele-tender-tender-document
  config:
    import: optional:file:${user.home}/.ele-tender/ele-tender-tender-document-local.yml
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:127.0.0.1}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
      database: ${SPRING_DATA_REDIS_DATABASE:${SPRING_REDIS_DATABASE:5}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}

jwt:
  secret: ${APP_JWT_SECRET:}
  expiration: ${APP_JWT_EXPIRATION:7200}
  external-expiration: ${APP_JWT_EXTERNAL_EXPIRATION:604800}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    com.jy.eletender: debug

tender-document:
  generation-timeout-seconds: ${TENDER_DOCUMENT_GENERATION_TIMEOUT_SECONDS:1800}
  version:
    # 招标文件编制系统版本号（整数上升）
    app-version: ${TENDER_DOCUMENT_APP_VERSION:1}
    # 招标文件格式版本号（格式版本号_招标系统版本号_自定义）
    format-version: ${TENDER_DOCUMENT_FORMAT_VERSION:0.0.1}
  interaction:
    file-service-base-url: http://localhost:8081
    file-upload-path: /api/file/upload
    file-download-path: /api/file/download/{fileId}
    upload-biz-type: tender-document
    final-package-suffix: .HzctZbs
    final-package-encrypt-algorithm: AES/GCM/NoPadding
    final-package-aes-key-base64: ${TENDER_DOCUMENT_FINAL_PACKAGE_AES_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    compile-info-watermark-text: 城投集团采购平台
