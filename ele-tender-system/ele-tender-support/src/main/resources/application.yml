server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

spring:
  application:
    name: ele-tender-support
  config:
    import: optional:file:${user.home}/.ele-tender/ele-tender-support-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/ele_tender?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:127.0.0.1}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
      database: ${SPRING_DATA_REDIS_DATABASE:${SPRING_REDIS_DATABASE:5}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}
      timeout: 5s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jy.eletender.support.entity
  global-config:
    db-config:
      id-type: auto
      table-prefix: sup_
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt:
  secret: ${APP_JWT_SECRET:}
  # Token过期时间（秒）- 2小时
  expiration: 7200
  # 外部Token过期时间（秒）- 7天（可按环境覆盖）
  external-expiration: 604800

# 外部系统签名配置
signature:
  # 签名有效期（秒）- 默认5分钟（可按环境覆盖）
  expire-seconds: 300

# Swagger配置
swagger:
  enabled: true

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    com.jy.eletender: debug

crypto-admin:
  stream-key: ${CRYPTO_STREAM_KEY:bdc:decrypt:tasks}
